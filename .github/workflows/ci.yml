name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            strands-bridge/package-lock.json
      - name: Build pinned Kujo runtime
        run: |
          git clone https://github.com/kujolang/kujo.git "$RUNNER_TEMP/kujo"
          git -C "$RUNNER_TEMP/kujo" checkout 1395f49ff794707380728df3b80ed363788461c0
          cargo build --locked --release --manifest-path "$RUNNER_TEMP/kujo/Cargo.toml"
          echo "$RUNNER_TEMP/kujo/target/release" >> "$GITHUB_PATH"
      - name: Install JavaScript dependencies
        run: npm run install:all
      - name: Verify Kujo contracts
        run: kujo check main.kujo && kujo test -v
      - name: Verify bridge and operator console
        run: npm run check
