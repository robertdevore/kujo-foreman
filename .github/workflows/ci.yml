name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agentcore/cdk/package-lock.json
            apps/web/package-lock.json
            strands-bridge/package-lock.json
      - name: Install verified Kujo runtime
        run: |
          curl -fsSLo "$RUNNER_TEMP/kujo.tar.gz" https://github.com/kujolang/kujo/releases/download/v1.4.0/kujo-v1.4.0-linux-x64.tar.gz
          echo "49a4803b70b51a5d6cba04b5aba2bbe8786d19ec15861c18b67c3bac8670233c  $RUNNER_TEMP/kujo.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kujo-bin"
          tar -xzf "$RUNNER_TEMP/kujo.tar.gz" -C "$RUNNER_TEMP/kujo-bin"
          echo "$RUNNER_TEMP/kujo-bin" >> "$GITHUB_PATH"
      - name: Install JavaScript dependencies
        run: npm run install:all
      - name: Verify Kujo contracts
        run: kujo check main.kujo && kujo test -v
      - name: Verify bridge and operator console
        run: npm run check
      - name: Validate AgentCore deployment
        run: |
          npm install -g @aws/agentcore@0.29.0 --ignore-scripts
          npm run agentcore:validate
          npm --prefix agentcore/cdk audit --audit-level=high
      - name: Build and smoke AgentCore container
        run: |
          docker build --file agentcore/Dockerfile --build-arg TARGETARCH=amd64 --tag kujo-foreman:ci .
          docker run --detach --rm --name kujo-foreman-ci --publish 127.0.0.1:8080:8080 --env FOREMAN_MODE=offline kujo-foreman:ci
          npm run agentcore:smoke
      - name: Stop AgentCore container
        if: always()
        run: docker stop kujo-foreman-ci 2>/dev/null || true
